services:
  comfyui:
    build: .
    container_name: comfyui
    ports:
      - "8188:8188"
    volumes:
      # Maps your local models directory to the container
      - ./comfy_models:/workspace/models
      # Maps your local output directory so you never lose generated images
      - ./comfy_output:/workspace/output
    deploy:
      resources:
        reservations:
          devices:
            # This block is the modern way to pass through your RTX 3060 GPU
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
